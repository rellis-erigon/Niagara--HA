configuration:
  niagara_host:
    name: Niagara Host
    description: IP address or hostname of the Niagara 4 station
  niagara_port:
    name: Niagara Port
    description: HTTPS port (default 443)
  niagara_user:
    name: Username
    description: oBIX user account on the Niagara station
  niagara_password:
    name: Password
    description: Password for the oBIX user account
  use_https:
    name: Use HTTPS
    description: Connect over HTTPS (recommended)
  verify_ssl:
    name: Verify SSL
    description: Verify the Niagara station's SSL certificate (disable for self-signed certs)
  poll_interval_seconds:
    name: Poll Interval
    description: How often to read point values from Niagara (seconds)
  point_filter:
    name: Point Filter
    description: Optional path prefix to limit discovery (e.g. /config/AHU/). Leave empty for all points.
  device_name:
    name: Device Name
    description: Base name for devices in Home Assistant (groups appear as "Name — Group")
  mqtt_topic_prefix:
    name: MQTT Topic Prefix
    description: Prefix for all MQTT topics published by this add-on
  log_level:
    name: Log Level
    description: Logging verbosity
