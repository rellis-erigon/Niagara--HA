name: "Niagara BMS Bridge"
description: "Connect Tridium Niagara 4 BMS to Home Assistant via oBIX"
version: "0.4.0"
slug: niagara-ha
url: "https://github.com/rellis-erigon/niagara--ha"
init: false
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:office-building
panel_title: Niagara BMS
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
map:
  - config:rw
options:
  niagara_host: ""
  niagara_port: 443
  niagara_user: ""
  niagara_password: ""
  use_https: true
  verify_ssl: false
  poll_interval_seconds: 30
  point_filter: ""
  poll_workers: 5
  device_name: "Niagara BMS"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_topic_prefix: "niagara"
  log_level: "info"
schema:
  niagara_host: str
  niagara_port: port
  niagara_user: str
  niagara_password: password
  use_https: bool
  verify_ssl: bool
  poll_interval_seconds: int(5,3600)
  point_filter: str?
  poll_workers: int(1,20)
  device_name: str
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  log_level: list(debug|info|warning|error)
services:
  - mqtt:need
