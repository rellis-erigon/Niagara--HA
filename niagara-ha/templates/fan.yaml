id: fan
name: Fan / VFD
description: Supply, return or exhaust fan with run status and fault
icon: mdi:fan

device_match: ["*fan*", "*exhaust*", "*vfd*"]

slots:
  - key: run_status
    name: Run Status
    required: true
    device_class: running
    point_types: [boolean]
    match: ["*run*status*", "*run*", "sts", "*_sts", "*on*off*", "*enable*"]

  - key: fault
    name: Fault
    device_class: problem
    point_types: [boolean]
    match: ["*fault*", "*alarm*", "*trip*", "*fail*"]

  - key: speed
    name: Speed
    state_class: measurement
    units: ["%", Hz, rpm]
    point_types: [numeric, integer]
    match: ["*speed*", "*spd*", "*vfd*", "*inverter*output*", "*freq*"]
    validation: {min: 0}

  - key: command
    name: Start/Stop Command
    point_types: [boolean]
    match: ["*command*", "*cmd*", "*start*stop*"]

# Inlet direction cannot be discovered from points, so the generic
# top-entry drawing is the default. Change the faceplate per device in
# the add-on where the duct actually comes in from the side.
card:
  type: vertical-stack
  cards:
    - type: custom:plant-equipment-card
      faceplate: supply-fan-top
      title: "{{device_name}}"
      entities:
        run: "{{slot.run_status}}"
        fault: "{{slot.fault}}"
        speed: "{{slot.speed}}"
    - type: entities
      entities:
        - entity: "{{slot.command}}"
          name: Command
