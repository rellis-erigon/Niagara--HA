id: fridge
name: Fridge / Freezer / Cool Room
description: Refrigeration unit with temperature, door and compressor status
icon: mdi:fridge

# "*frezzer*" is not a typo here — it is the station's. Four cabinets are
# commissioned with that spelling, and a template that only knows the
# correct one leaves them untyped forever.
device_match: ["*fridge*", "*freezer*", "*frezzer*", "*coolroom*", "*cool*room*",
               "*chiller*room*", "*keg*", "*cellar*", "*underbench*"]

slots:
  - key: temperature
    name: Temperature
    required: true
    device_class: temperature
    state_class: measurement
    units: ["°C", "°F"]
    point_types: [numeric, integer]
    match: ["*fridge*temp*", "*freezer*temp*", "*-temp", "*_temp", "*temp*"]
    validation:
      min: -40
      max: 30

  - key: door
    name: Door
    device_class: door
    point_types: [boolean]
    match: ["*door*", "*dr*open*"]

  - key: compressor
    name: Compressor
    device_class: running
    point_types: [boolean]
    match: ["*comp*", "*compressor*"]

  - key: alarm
    name: Alarm
    device_class: problem
    point_types: [boolean]
    match: ["*alarm*", "*fault*", "*high*temp*"]

  - key: setpoint
    name: Setpoint
    device_class: temperature
    state_class: measurement
    units: ["°C", "°F"]
    point_types: [numeric, integer]
    match: ["*setpoint*", "*stpt*", "*sp"]
    validation:
      min: -40
      max: 30

# The cabinet drawing, then anything the drawing does not show. The
# faceplate defaults to a two-door under-bench fridge because that is the
# commonest unit in a kitchen; change it per device in the add-on to the
# shape actually in the room — walk-in, upright, or a different door and
# drawer count. Freezers take the matching -freezer faceplate, which is
# the same drawing in a colder palette and against a colder band.
card:
  type: vertical-stack
  cards:
    - type: custom:plant-equipment-card
      faceplate: underbench-fridge
      title: "{{device_name}}"
      options:
        doors: 2
        drawers: 0
      entities:
        temperature: "{{slot.temperature}}"
        setpoint: "{{slot.setpoint}}"
        door: "{{slot.door}}"
        compressor: "{{slot.compressor}}"
        alarm: "{{slot.alarm}}"
    - type: entities
      entities:
        - entity: "{{slot.alarm}}"
          name: Alarm
