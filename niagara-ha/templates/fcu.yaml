id: fcu
name: Fan Coil / Split Unit
description: Room air conditioning unit with mode, status and room temperature
icon: mdi:air-conditioner

device_match: ["fcu*", "*fridge*", "*freezer*", "*room*"]

slots:
  - key: room_temperature
    name: Room Temperature
    required: true
    device_class: temperature
    state_class: measurement
    units: ["°C", "°F"]
    point_types: [numeric, integer]
    match: ["roomtemp", "*room*temp*", "*space*temp*", "*return*air*", "*temp*"]
    validation: {min: -20, max: 60}

  - key: run_status
    name: Run Status
    device_class: running
    point_types: [boolean]
    match: ["*startstopstatus*", "*run*status*", "*run*", "*on*off*"]

  - key: command
    name: Start/Stop Command
    point_types: [boolean]
    match: ["startstopcommand", "*command*", "*cmd*"]

  - key: mode
    name: Mode
    point_types: [enum, string]
    match: ["*airconmodestatus*", "*mode*status*", "*mode*"]

  # Two slots claim "TempAdjust" because the name means two different
  # things depending on the controller: a +/-3K offset dial from the room's
  # base setpoint, or the absolute room setpoint itself. The reading tells
  # them apart — 22 cannot be an offset and 2 cannot be a room setpoint —
  # so the declared ranges decide whenever a value is known.
  #
  # This slot is declared first deliberately. Order is the tie-break when
  # no reading is available yet, and the offset reading is the one that
  # cannot be rejected on range: 0 is normal for it, and treating a healthy
  # 0 as a setpoint blocked every room from publishing.
  - key: temp_adjust
    name: Setpoint Adjust
    device_class: temperature
    state_class: measurement
    units: ["°C", "°F"]
    point_types: [numeric, integer]
    match: ["*tempadjust*", "*temp*adjust*", "*adjust*"]
    validation: {min: -10, max: 10}

  - key: setpoint
    name: Setpoint
    device_class: temperature
    state_class: measurement
    units: ["°C", "°F"]
    point_types: [numeric, integer]
    match: ["*setpoint*", "*stpt*", "*set*pt*", "*tempadjust*", "*temp*adjust*"]
    validation: {min: 5, max: 40}

  - key: fan_status
    name: Fan Status
    device_class: running
    point_types: [boolean]
    match: ["*indoorfanstatus*", "*fan*status*", "*fan*"]

  - key: alarm
    name: Alarm
    device_class: problem
    point_types: [boolean]
    match: ["alarm", "*alarm*", "*fault*"]

# The mimic first, then the points it does not draw. There are a couple
# of hundred of these on a site, so the tile is deliberately compact and
# the room temperature is the thing legible from a distance.
card:
  type: vertical-stack
  cards:
    - type: custom:hvac-controller-card
      faceplate: fcu-unit
      title: "{{device_name}}"
      entities:
        room_temp: "{{slot.room_temperature}}"
        setpoint: "{{slot.setpoint}}"
        hvac_mode: "{{slot.mode}}"
        fan_speed: "{{slot.fan_status}}"
        run: "{{slot.run_status}}"
        fault: "{{slot.alarm}}"
    - type: entities
      entities:
        - entity: "{{slot.command}}"
          name: Start/Stop Command
        - entity: "{{slot.temp_adjust}}"
          name: Setpoint Adjust
