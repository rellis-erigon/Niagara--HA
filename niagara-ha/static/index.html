<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niagara BMS Bridge</title>
<style>
:root {
  --bg: #f5f6fa;
  --card: #ffffff;
  --border: #e0e3eb;
  --text: #1a1d23;
  --muted: #6b7280;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --success: #22c55e;
  --danger: #ef4444;
  --tag-bg: #e5e7eb;
  --toggle-off: #d1d5db;
  --toggle-on: #3b82f6;
  --row-hover: #f0f4ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318;
    --card: #1c1f26;
    --border: #2d3140;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --tag-bg: #374151;
    --toggle-off: #4b5563;
    --row-hover: #1e2432;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 16px;
}
h1 { font-size: 1.4rem; font-weight: 600; }
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 20px;
  text-align: center;
  min-width: 100px;
}
.stat-value { font-size: 1.6rem; font-weight: 700; }
.stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-enabled .stat-value { color: var(--success); }
.stat-disabled .stat-value { color: var(--danger); }

.layout { display: flex; gap: 16px; }
@media (max-width: 768px) { .layout { flex-direction: column; } }

.sidebar {
  min-width: 320px;
  width: max-content;
  max-width: 50%;
  flex-shrink: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
@media (max-width: 768px) { .sidebar { width: 100%; max-width: 100%; min-width: 0; max-height: 300px; overflow-y: auto; } }
.sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.group-list { max-height: calc(100vh - 260px); overflow-y: auto; }
.group-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.group-item:hover { background: var(--row-hover); }
.group-item.active { background: var(--row-hover); border-left: 3px solid var(--primary); padding-left: 13px; }
.group-name { font-size: 0.9rem; font-weight: 500; flex: 1; }
.group-counts {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 0.75rem;
}
.group-badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}
.badge-total { background: var(--tag-bg); color: var(--muted); }
.badge-enabled { background: #dcfce7; color: #166534; }
@media (prefers-color-scheme: dark) { .badge-enabled { background: #14532d; color: #86efac; } }
.group-toggle {
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-left: 8px;
}
.group-toggle-on { background: var(--success); color: white; }
.group-toggle-off { background: var(--tag-bg); color: var(--muted); }

.main { flex: 1; min-width: 0; }
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font-size: 0.9rem;
}
.search-box:focus { outline: 2px solid var(--primary); border-color: transparent; }
.btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  white-space: nowrap;
  transition: background 0.15s;
}
.btn:hover { background: var(--row-hover); }
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-sm { padding: 4px 10px; font-size: 0.8rem; }
.filter-btns { display: flex; gap: 4px; }
.filter-btns .btn.active { background: var(--primary); color: white; border-color: var(--primary); }

.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  padding: 10px 16px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  background: var(--card);
  position: sticky;
  top: 0;
}
td {
  padding: 8px 16px;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border);
}
tr:hover td { background: var(--row-hover); }
.point-path { color: var(--muted); font-size: 0.75rem; word-break: break-all; }
.point-type {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  background: var(--tag-bg);
  color: var(--muted);
  text-transform: uppercase;
}

.toggle {
  position: relative;
  width: 40px;
  height: 22px;
  cursor: pointer;
}
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: var(--toggle-off);
  border-radius: 11px;
  transition: background 0.2s;
}
.toggle-slider::before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--toggle-on); }
.toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
}
.page-info { font-size: 0.85rem; color: var(--muted); }
.empty {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
}
.empty-icon { font-size: 2rem; margin-bottom: 8px; }
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #1a1d23;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 0.85rem;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateY(0); }
@media (prefers-color-scheme: dark) { .toast { background: #374151; } }
.loading { text-align: center; padding: 24px; color: var(--muted); }
.bulk-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--card);
  border: 1px solid var(--primary);
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 0.85rem;
}
.bulk-bar-count { font-weight: 600; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  max-width: 560px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
.modal h3 { font-size: 0.95rem; margin: 16px 0 8px; }
.profile-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.profile-card:hover { border-color: var(--primary); background: var(--row-hover); }
.profile-name { font-weight: 600; font-size: 0.9rem; }
.profile-desc { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.profile-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.rule-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rule-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--tag-bg);
  border-radius: 12px;
  font-size: 0.8rem;
  font-family: "SF Mono", "Cascadia Code", monospace;
}
.rule-tag-remove {
  cursor: pointer;
  color: var(--muted);
  font-size: 0.7rem;
  padding: 0 2px;
}
.rule-tag-remove:hover { color: var(--danger); }
.rule-input-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.rule-input-row input {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font-size: 0.85rem;
  font-family: "SF Mono", "Cascadia Code", monospace;
}
.preview-list {
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 8px 0;
}
.preview-item {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
}
.preview-item:last-child { border-bottom: none; }
.preview-item-name { font-weight: 500; }
.preview-item-path { color: var(--muted); font-size: 0.75rem; }
.point-value {
  font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
  font-size: 0.8rem;
  color: var(--text);
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.point-value-na { color: var(--muted); font-style: italic; font-family: inherit; }
.category-select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font-size: 0.85rem;
  cursor: pointer;
  min-width: 140px;
}
.category-select:focus { outline: 2px solid var(--primary); border-color: transparent; }
.cat-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
}
.cat-Temperature { background: #fef3c7; color: #92400e; }
.cat-Fan { background: #dbeafe; color: #1e40af; }
.cat-Pump { background: #e0e7ff; color: #3730a3; }
.cat-Valve { background: #fce7f3; color: #9d174d; }
.cat-Pressure { background: #fde68a; color: #78350f; }
.cat-Power { background: #fecaca; color: #991b1b; }
.cat-Humidity { background: #d1fae5; color: #065f46; }
.cat-Flow { background: #cffafe; color: #155e75; }
.cat-Setpoint { background: #ede9fe; color: #5b21b6; }
.cat-Status { background: #e5e7eb; color: #374151; }
.cat-CO2 { background: #f3e8ff; color: #6b21a8; }
.cat-Other { background: var(--tag-bg); color: var(--muted); }
@media (prefers-color-scheme: dark) {
  .cat-Temperature { background: #78350f; color: #fef3c7; }
  .cat-Fan { background: #1e3a5f; color: #93c5fd; }
  .cat-Pump { background: #312e81; color: #c7d2fe; }
  .cat-Valve { background: #831843; color: #fbcfe8; }
  .cat-Pressure { background: #713f12; color: #fde68a; }
  .cat-Power { background: #7f1d1d; color: #fecaca; }
  .cat-Humidity { background: #064e3b; color: #a7f3d0; }
  .cat-Flow { background: #164e63; color: #a5f3fc; }
  .cat-Setpoint { background: #4c1d95; color: #ddd6fe; }
  .cat-Status { background: #374151; color: #d1d5db; }
  .cat-CO2 { background: #581c87; color: #e9d5ff; }
}
.point-name-row { display: flex; align-items: center; gap: 6px; }
.point-custom-name { font-weight: 600; }
.point-original-name { font-size: 0.8rem; color: var(--muted); }
.rename-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.75rem;
  padding: 2px 4px;
  border-radius: 4px;
  flex-shrink: 0;
}
.rename-btn:hover { color: var(--primary); background: var(--row-hover); }
.rename-input {
  padding: 4px 8px;
  border: 1px solid var(--primary);
  border-radius: 4px;
  background: var(--card);
  color: var(--text);
  font-size: 0.85rem;
  width: 100%;
  max-width: 300px;
}
.rename-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  font-size: 0.8rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  min-height: 36px;
}
.breadcrumb-seg {
  cursor: pointer;
  color: var(--primary);
  font-weight: 500;
}
.breadcrumb-seg:hover { text-decoration: underline; }
.breadcrumb-current { color: var(--text); font-weight: 600; cursor: default; }
.breadcrumb-sep { color: var(--muted); font-size: 0.7rem; }
.tree-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  gap: 8px;
}
.tree-item:hover { background: var(--row-hover); }
.tree-item-name {
  font-size: 0.85rem;
  font-weight: 500;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
}
.tree-item-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.tree-arrow {
  color: var(--muted);
  font-size: 0.7rem;
  flex-shrink: 0;
}
.tree-enable-btn {
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.device-btn {
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.7rem;
  background: var(--card);
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.device-btn:hover { border-color: var(--primary); color: var(--primary); }
.device-btn.is-device {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.device-btn.is-device:hover { background: var(--primary-hover); }

/* -- Devices view -------------------------------------------------- */
.viewnav { display: flex; gap: 4px; margin-bottom: 16px; }
.viewnav .btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.device-table { width: 100%; border-collapse: collapse; }
.device-table th {
  text-align: left; font-size: 0.75rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); font-weight: 600;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
}
.device-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.device-table tr:hover td { background: var(--row-hover); }
.device-name { font-weight: 500; }
.device-path { font-size: 0.75rem; color: var(--muted); }
.type-select {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--card); color: var(--text); font-size: 0.85rem; max-width: 190px;
}
.pill {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 0.75rem; font-weight: 500;
}
.pill-draft { background: var(--tag-bg); color: var(--muted); }
.pill-ok { background: #dcfce7; color: #166534; }
.pill-warn { background: #fef3c7; color: #92400e; }
.pill-none { background: transparent; color: var(--muted); font-style: italic; }
.pill-blocked { background: #fee2e2; color: #991b1b; }
.pill-published { background: #dbeafe; color: #1e40af; }
@media (prefers-color-scheme: dark) { .pill-published { background: #1e3a8a; color: #bfdbfe; } }
@media (prefers-color-scheme: dark) { .pill-blocked { background: #7f1d1d; color: #fecaca; } }
.issue { font-size: 0.72rem; margin-top: 3px; }
.issue-blocked { color: var(--danger); }
.unit-cell { display: flex; align-items: center; gap: 4px; }
.unit-value { font-size: 0.85rem; }
.unit-none { color: var(--muted); font-style: italic; font-size: 0.85rem; }
.unit-custom { color: var(--primary); font-weight: 600; font-size: 0.85rem; }
.unit-btn {
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 0.8rem; padding: 0 2px; opacity: 0.6;
}
.unit-btn:hover { opacity: 1; color: var(--primary); }
.issue-warning { color: #b45309; }
@media (prefers-color-scheme: dark) { .issue-warning { color: #fbbf24; } }
@media (prefers-color-scheme: dark) {
  .pill-ok { background: #14532d; color: #86efac; }
  .pill-warn { background: #713f12; color: #fde68a; }
}
.slot-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.slot-table td { padding: 7px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.slot-key { font-size: 0.85rem; }
.slot-req { color: var(--danger); margin-left: 3px; }
.slot-meta { font-size: 0.72rem; color: var(--muted); }
.slot-select {
  width: 100%; padding: 5px 8px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--card); color: var(--text); font-size: 0.82rem;
}
.modal-wide { max-width: 720px; }
.diag-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; margin-bottom: 12px; border-left: 4px solid var(--muted);
}
.diag-card.error { border-left-color: var(--danger); }
.diag-card.warning { border-left-color: #d97706; }
.diag-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.diag-title { font-weight: 650; font-size: 0.98rem; }
.diag-sev {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 2px 7px; border-radius: 999px; font-weight: 700;
}
.diag-sev.error { background: #fee2e2; color: #991b1b; }
.diag-sev.warning { background: #fef3c7; color: #92400e; }
.diag-detail { color: var(--muted); font-size: 0.86rem; margin: 6px 0 0; }
.diag-action { font-size: 0.86rem; margin: 8px 0 0; }
.diag-action b { font-weight: 650; }
.diag-toggle {
  background: none; border: none; color: var(--primary); cursor: pointer;
  font-size: 0.82rem; padding: 6px 0 0; font-family: inherit;
}
.diag-items {
  margin: 8px 0 0; max-height: 280px; overflow: auto;
  border-top: 1px solid var(--border); padding-top: 8px;
}
.diag-item {
  display: flex; gap: 12px; font-size: 0.8rem; padding: 3px 0;
  font-family: ui-monospace, Menlo, monospace;
}
.diag-item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diag-more { color: var(--muted); font-size: 0.8rem; padding-top: 6px; }
.diag-ok { padding: 48px; text-align: center; color: var(--muted); }
.diag-ok strong { display: block; font-size: 1.1rem; color: var(--success); margin-bottom: 6px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <h1>Niagara BMS Bridge</h1>
  <div class="stats" id="stats"></div>
</div>


<div class="viewnav">
  <button class="btn active" data-view="points">Points</button>
  <button class="btn" data-view="devices">Devices</button>
  <button class="btn" data-view="diagnostics">Diagnostics <span id="diag-badge"></span></button>
</div>

<div class="layout" id="view-points">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Browse</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:0.75rem;color:var(--muted)" id="tree-count"></span>
        <button class="btn btn-sm btn-primary" id="btn-apply-devices" title="Recalculate device groupings and update HA entities">Apply Changes</button>
      <button class="btn btn-sm" id="btn-rescan" title="Rediscover points from the station. Use after adding points in Niagara.">Re-scan</button>
      </div>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="group-list" id="tree-list">
      <div class="loading">Loading...</div>
    </div>
  </div>
  <div class="main">
    <div class="toolbar">
      <input type="text" class="search-box" id="search" placeholder="Search points by name or path...">
      <select class="category-select" id="category-filter">

    <select class="category-select" id="device-type-filter">
      <option value="">All types</option>

<div id="view-diagnostics" style="display:none">
  <div class="toolbar">
    <span style="font-size:0.85rem;color:var(--muted)" id="diag-summary">Checking...</span>
    <button class="btn btn-sm" id="diag-refresh" style="margin-left:auto">Re-check</button>
  </div>
  <div id="diag-list"></div>
</div>

<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
const $ = s => document.querySelector(s);

// Niagara encodes punctuation in names as $XX hex escapes, so a distribution
// board reads "DB$2dL5$2e1$2dPower" raw. Decode wherever a name is shown.
const decodeNiagara = s => String(s == null ? '' : s)
  .replace(/\$([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
const BASE = window.location.pathname.replace(/\/+$/, '');
let state = { prefix: '', search: '', status: '', category: '', page: 1 };
let deviceFolders = [];
let deviceFoldersChanged = false;
let debounceTimer;

async function api(path, opts) {
  const url = BASE + (path.startsWith('/') ? path : '/' + path);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(res.statusText);
  return res.json();
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

async function loadStats() {
  try {
    const data = await api('/api/stats');
    if (data.total === 0) {
      $('#stats').innerHTML = '';
      $('#tree-list').innerHTML = `<div class="empty" style="padding:24px">
        <div class="empty-icon">&#9203;</div>
        <div>Waiting for point discovery&hellip;</div>
        <div style="font-size:0.8rem;margin-top:8px">
          Configure the Niagara connection in the add-on settings and restart.
          Points will appear here once discovered.
        </div>
      </div>`;
      return;
    }
    $('#stats').innerHTML = `
      <div class="stat"><div class="stat-value">${data.total.toLocaleString()}</div><div class="stat-label">Total Points</div></div>
      <div class="stat stat-enabled"><div class="stat-value">${data.enabled.toLocaleString()}</div><div class="stat-label">Enabled</div></div>
      <div class="stat stat-disabled"><div class="stat-value">${data.disabled.toLocaleString()}</div><div class="stat-label">Disabled</div></div>
    `;
    renderCategories(data.categories || []);
  } catch (e) {
    $('#tree-list').innerHTML = `<div class="empty" style="padding:24px">
      <div class="empty-icon">&#9888;</div>
      <div>Could not load points</div>
      <div style="font-size:0.8rem;margin-top:8px">${esc(e.message)}</div>
    </div>`;
  }
}

async function loadTree() {
  try {
    const data = await api('/api/tree?prefix=' + encodeURIComponent(state.prefix));
    renderBreadcrumb();
    renderTree(data.children);
  } catch (e) {
    $('#tree-list').innerHTML = `<div class="empty" style="padding:24px">Failed to load tree</div>`;
  }
}

function renderBreadcrumb() {
  const bc = $('#breadcrumb');
  if (!state.prefix) {
    bc.innerHTML = '<span class="breadcrumb-current">All Devices</span>';
    return;
  }
  const parts = state.prefix.split('/');
  let html = `<span class="breadcrumb-seg" data-nav="">All</span>`;
  for (let i = 0; i < parts.length; i++) {
    html += `<span class="breadcrumb-sep">&#9656;</span>`;
    const partial = parts.slice(0, i + 1).join('/');
    if (i === parts.length - 1) {
      html += `<span class="breadcrumb-current">${esc(decodeNiagara(parts[i]))}</span>`;
    } else {
      html += `<span class="breadcrumb-seg" data-nav="${esc(partial)}">${esc(decodeNiagara(parts[i]))}</span>`;
    }
  }
  bc.innerHTML = html;
  bc.querySelectorAll('.breadcrumb-seg').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.dataset.nav));
  });
}

function renderTree(children) {
  const el = $('#tree-list');
  $('#tree-count').textContent = children.length + ' items';

  if (children.length === 0) {
    el.innerHTML = `<div class="empty" style="padding:24px">No sub-items here</div>`;
    return;
  }

  el.innerHTML = children.map(c => {
    const allEnabled = c.enabled === c.total && c.total > 0;
    const someEnabled = c.enabled > 0;
    const isDevice = deviceFolders.includes(c.path);
    return `<div class="tree-item" data-path="${esc(c.path)}">
      <span class="tree-item-name" title="${esc(decodeNiagara(c.name))}">${esc(decodeNiagara(c.name))}</span>
      <div class="tree-item-right">
        <button class="device-btn ${isDevice ? 'is-device' : ''}"
                data-device-path="${esc(c.path)}"
                title="${isDevice ? 'Remove as HA device' : 'Use as HA device — all sub-points become one device'}">
          ${isDevice ? '&#10003; Device' : 'Use as Device'}
        </button>
        ${c.enabled > 0 ? `<span class="group-badge badge-enabled">${c.enabled}</span>` : ''}
        <span class="group-badge badge-total">${c.total.toLocaleString()}</span>
        <button class="tree-enable-btn ${someEnabled ? 'group-toggle-on' : 'group-toggle-off'}"
                data-toggle-prefix="${esc(c.path)}" data-enable="${!allEnabled}"
                title="${allEnabled ? 'Disable all in ' + decodeNiagara(c.name) : 'Enable all in ' + decodeNiagara(c.name)}">
          ${allEnabled ? '&#10003;' : '&#9711;'}
        </button>
        ${c.has_children ? '<span class="tree-arrow">&#9656;</span>' : ''}
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.tree-item').forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.closest('.tree-enable-btn')) return;
      navigateTo(item.dataset.path);
    });
  });

  el.querySelectorAll('.tree-enable-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const prefix = btn.dataset.togglePrefix;
      const enabled = btn.dataset.enable === 'true';
      const data = await api('/api/filtered/toggle', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ prefix, enabled }),
      });
      toast(`${data.count} points ${enabled ? 'enabled' : 'disabled'}`);
      loadStats();
      loadTree();
      loadPoints();
    });
  });

  el.querySelectorAll('.device-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const folder = btn.dataset.devicePath;
      const data = await api('/api/device-folders/toggle', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ folder }),
      });
      deviceFolders = data.folders;
      if (data.action === 'added') {
        let msg = `"${folder}" set as HA device`;
        if (data.enabled > 0) msg += ` — ${data.enabled} points enabled`;
        toast(msg);
      } else {
        toast(`"${folder}" removed as device`);
      }
      loadStats();
      loadTree();
      loadPoints();
    });
  });
}

function renderCategories(categories) {
  const sel = $('#category-filter');
  const current = sel.value;
  sel.innerHTML = '<option value="">All Categories</option>' +
    categories.map(c => `<option value="${esc(c.name)}" ${state.category === c.name ? 'selected' : ''}>${esc(c.name)} (${c.count.toLocaleString()})</option>`).join('');
}

function navigateTo(prefix) {
  state.prefix = prefix || '';
  state.page = 1;
  loadTree();
  loadPoints();
}

async function loadPoints() {
  const params = new URLSearchParams();
  if (state.prefix) params.set('prefix', state.prefix);
  if (state.search) params.set('search', state.search);
  if (state.status) params.set('status', state.status);
  if (state.category) params.set('category', state.category);
  params.set('page', state.page);

  let data;
  try {
    data = await api('/api/points?' + params);
  } catch (e) {
    $('#point-table').innerHTML = `<tr><td colspan="6"><div class="empty">
      <div class="empty-icon">&#9888;</div>Failed to load points</div></td></tr>`;
    return;
  }

  updateBulkBar(data.total);

  if (data.points.length === 0) {
    $('#point-table').innerHTML = `<tr><td colspan="6"><div class="empty">
      <div class="empty-icon">&#128269;</div>
      No points found${state.search ? ' matching "' + esc(state.search) + '"' : ''}
    </div></td></tr>`;
    $('#pagination').innerHTML = '';
    return;
  }

  $('#point-table').innerHTML = data.points.map(p => {
    const hasCustom = p.custom_name && p.custom_name !== p.name;
    return `<tr>
    <td>
      <label class="toggle">
        <input type="checkbox" ${p.enabled ? 'checked' : ''} data-path="${esc(p.path)}">
        <span class="toggle-slider"></span>
      </label>
    </td>
    <td>
      <div class="point-name-row">
        <span class="point-name-display">${hasCustom ? `<span class="point-custom-name">${esc(p.custom_name)}</span>` : esc(decodeNiagara(p.name))}</span>
        <button class="rename-btn" data-rename-path="${esc(p.path)}" data-current-name="${esc(p.custom_name || '')}" data-original-name="${esc(decodeNiagara(p.name))}" title="Rename">&#9998;</button>
      </div>
      ${hasCustom ? `<div class="point-original-name">${esc(decodeNiagara(p.name))}</div>` : ''}
      <div class="point-path">${esc(p.path)}</div>
    </td>
    <td><span class="point-value point-value-na" data-value-path="${esc(p.path)}">&mdash;</span></td>
    <td>${unitCell(p)}</td>
    <td><span class="cat-badge cat-${p.category || 'Other'}">${esc(p.category || 'Other')}</span></td>
    <td><span class="point-type">${esc(p.type)}</span></td>
    <td>${esc(decodeNiagara(p.group))}</td>
  </tr>`;
  }).join('');

  $('#point-table').querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', async () => {
      await api('/api/points/toggle', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ path: cb.dataset.path, enabled: cb.checked }),
      });
      loadStats();
    });
  });

  $('#point-table').querySelectorAll('.rename-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const path = btn.dataset.renamePath;
      const current = btn.dataset.currentName;
      const original = btn.dataset.originalName;
      const td = btn.closest('td');
      const nameRow = td.querySelector('.point-name-row');
      nameRow.innerHTML = `<input type="text" class="rename-input" value="${esc(current || original)}" placeholder="${esc(original)}">
        <button class="btn btn-sm btn-primary" id="rename-save">Save</button>
        <button class="btn btn-sm" id="rename-cancel">Cancel</button>
        <button class="btn btn-sm" id="rename-clear" title="Reset to original" style="${current ? '' : 'display:none'}">Reset</button>`;
      const input = nameRow.querySelector('.rename-input');
      input.focus();
      input.select();
      nameRow.querySelector('#rename-save').addEventListener('click', async () => {
        const newName = input.value.trim();
        await api('/api/points/rename', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ path, custom_name: newName === original ? '' : newName }),
        });
        toast(newName && newName !== original ? `Renamed to "${newName}"` : 'Name reset');
        loadPoints();
      });
      nameRow.querySelector('#rename-cancel').addEventListener('click', () => loadPoints());
      nameRow.querySelector('#rename-clear').addEventListener('click', async () => {
        await api('/api/points/rename', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ path, custom_name: '' }),
        });
        toast('Name reset to original');
        loadPoints();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') nameRow.querySelector('#rename-save').click();
        if (e.key === 'Escape') loadPoints();
      });
    });
  });

  loadValues(data.points.map(p => p.path));

  const { page, pages, total } = data;
  let pagHtml = `<span class="page-info">${total.toLocaleString()} points &mdash; page ${page} of ${pages}</span>`;
  if (pages > 1) {
    pagHtml += `<button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} id="prev-page">&laquo; Prev</button>`;
    pagHtml += `<button class="btn btn-sm" ${page >= pages ? 'disabled' : ''} id="next-page">Next &raquo;</button>`;
  }
  $('#pagination').innerHTML = pagHtml;
  if ($('#prev-page')) $('#prev-page').onclick = () => { state.page--; loadPoints(); };
  if ($('#next-page')) $('#next-page').onclick = () => { state.page++; loadPoints(); };
}

function updateBulkBar(total) {
  const bar = $('#bulk-bar');
  const hasFilter = state.search || state.prefix || state.status;
  if (hasFilter && total > 0) {
    bar.style.display = 'flex';
    $('#bulk-count').textContent = total.toLocaleString();
  } else {
    bar.style.display = 'none';
  }
}

$('#bulk-enable').addEventListener('click', async () => {
  const data = await api('/api/filtered/toggle', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ search: state.search, prefix: state.prefix, status: state.status, enabled: true }),
  });
  toast(`${data.count} points enabled`);
  loadStats();
  loadTree();
  loadPoints();
});

$('#bulk-disable').addEventListener('click', async () => {
  const data = await api('/api/filtered/toggle', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ search: state.search, prefix: state.prefix, status: state.status, enabled: false }),
  });
  toast(`${data.count} points disabled`);
  loadStats();
  loadTree();
  loadPoints();
});


/* -- Unit of measurement overrides ------------------------------------ */

let knownUnits = [];

async function loadUnits() {
  if (knownUnits.length) return knownUnits;
  try {
    knownUnits = (await api('/api/units')).units || [];
  } catch (e) {
    knownUnits = [];
  }
  return knownUnits;
}

function unitCell(p) {
  const shown = p.custom_unit || p.unit || '';
  const cls = p.custom_unit ? 'unit-custom' : (shown ? 'unit-value' : 'unit-none');
  const title = p.custom_unit
    ? `Overridden - Niagara reports "${esc(p.unit || 'none')}"`
    : 'Unit reported by Niagara';
  return `<div class="unit-cell">
      <span class="${cls}" title="${title}">${esc(shown || 'none')}</span>
      <button class="unit-btn" data-unit-path="${esc(p.path)}"
        data-unit-current="${esc(p.custom_unit || '')}"
        data-unit-discovered="${esc(p.unit || '')}"
        title="Set the unit of measurement">&#9998;</button>
    </div>`;
}

async function openUnitEditor(path, current, discovered) {
  await loadUnits();
  const options = knownUnits.map(u => `<option value="${esc(u)}"></option>`).join('');

  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>Unit of Measurement</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">
          Niagara reports <strong>${esc(discovered || 'no unit')}</strong> for this
          point. Set your own if that is missing or wrong — clearing it goes
          back to what Niagara reports.
        </p>
        <input class="slot-select" id="unit-input" list="unit-options"
               placeholder="e.g. kWh" value="${esc(current)}">
        <datalist id="unit-options">${options}</datalist>
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px">
          <button class="btn" id="unit-clear">Use Niagara's</button>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="unit-save">Save</button>
          </div>
        </div>
      </div>
    </div>`;

  const submit = async value => {
    try {
      const res = await fetch(BASE + '/api/points/unit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, unit: value }),
      });
      const body = await res.json();
      if (!res.ok) { toast(body.error || 'Could not set the unit'); return; }
      closeModal();
      toast(value ? `Unit set to ${value}` : "Using Niagara's unit");
      loadPoints();
      if (devices.length) loadDevices();
    } catch (e) {
      toast('Could not set the unit');
    }
  };

  $('#unit-save').addEventListener('click', () => submit($('#unit-input').value.trim()));
  $('#unit-clear').addEventListener('click', () => submit(''));
  $('#unit-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submit($('#unit-input').value.trim());
  });
  $('#unit-input').focus();
}

// Delegated, because the points table is re-rendered on every page change.
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-unit-path]');
  if (!btn) return;
  openUnitEditor(btn.dataset.unitPath, btn.dataset.unitCurrent, btn.dataset.unitDiscovered);
});

function closeModal() {
  $('#modal-root').innerHTML = '';
}

$('#btn-profiles').addEventListener('click', async () => {
  const data = await api('/api/profiles');
  let html = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>Point Profiles</h2>
      <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px">
        Apply a pre-built profile to enable common point patterns. Preview before applying.
      </p>`;
  for (const p of data.profiles) {
    html += `<div class="profile-card" data-profile="${esc(p.id)}">
      <div class="profile-name">${esc(p.name)}</div>
      <div class="profile-desc">${esc(p.description)}</div>
      <div class="profile-meta">${p.pattern_count} patterns</div>
    </div>`;
  }
  html += `</div></div>`;
  $('#modal-root').innerHTML = html;

  document.querySelectorAll('.profile-card').forEach(card => {
    card.addEventListener('click', () => showProfilePreview(card.dataset.profile));
  });
});

async function showProfilePreview(profileId) {
  const data = await api(`/api/profiles/${profileId}/preview`);
  let html = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>${esc(data.profile)}</h2>
      <p style="font-size:0.85rem;margin-bottom:8px">
        <strong>${data.would_enable}</strong> points would be enabled.
      </p>`;
  if (data.sample.length > 0) {
    html += `<div class="preview-list">`;
    for (const s of data.sample) {
      html += `<div class="preview-item">
        <div class="preview-item-name">${esc(s.name)}</div>
        <div class="preview-item-path">${esc(s.path)}</div>
      </div>`;
    }
    if (data.would_enable > data.sample.length) {
      html += `<div class="preview-item" style="text-align:center;color:var(--muted)">
        &hellip; and ${data.would_enable - data.sample.length} more
      </div>`;
    }
    html += `</div>`;
  }
  html += `<h3>Patterns</h3>
    <div class="rule-list">`;
  for (const pat of data.patterns) {
    html += `<span class="rule-tag">${esc(pat)}</span>`;
  }
  html += `</div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-primary" id="profile-apply">Apply Now</button>
      <button class="btn" id="profile-apply-save">Apply &amp; Save as Rules</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
    </div></div>`;
  $('#modal-root').innerHTML = html;

  $('#profile-apply').addEventListener('click', async () => {
    const result = await api(`/api/profiles/${profileId}/apply`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ save_as_rules: false }),
    });
    closeModal();
    toast(`${result.count} points enabled from ${result.profile}`);
    loadStats();
    loadPoints();
  });

  $('#profile-apply-save').addEventListener('click', async () => {
    const result = await api(`/api/profiles/${profileId}/apply`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ save_as_rules: true }),
    });
    closeModal();
    toast(`${result.count} points enabled, rules saved for future discovery`);
    loadStats();
    loadPoints();
  });
}

$('#btn-rules').addEventListener('click', showRulesModal);

async function showRulesModal() {
  const data = await api('/api/rules');
  let rules = data.patterns || [];

  function render() {
    let html = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>Auto-Enable Rules</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">
          Glob patterns matched against point names and paths.
          New points matching these rules are automatically enabled on discovery.
        </p>
        <div class="rule-list" id="rules-tags">`;
    for (let i = 0; i < rules.length; i++) {
      html += `<span class="rule-tag">${esc(rules[i])}
        <span class="rule-tag-remove" data-idx="${i}">&times;</span></span>`;
    }
    if (rules.length === 0) {
      html += `<span style="color:var(--muted);font-size:0.85rem">No rules configured</span>`;
    }
    html += `</div>
        <div class="rule-input-row">
          <input type="text" id="rule-input" placeholder="e.g. *Temp* or *AHU*Supply*">
          <button class="btn btn-sm btn-primary" id="rule-add">Add</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
          <button class="btn btn-primary" id="rules-save">Save Rules</button>
          <button class="btn" id="rules-apply">Save &amp; Apply to Existing</button>
          <button class="btn" onclick="closeModal()">Cancel</button>
        </div>
      </div></div>`;
    $('#modal-root').innerHTML = html;

    document.querySelectorAll('.rule-tag-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        rules.splice(parseInt(btn.dataset.idx), 1);
        render();
      });
    });

    const inp = $('#rule-input');
    const addRule = () => {
      const v = inp.value.trim();
      if (v && !rules.includes(v)) {
        rules.push(v);
        render();
      }
    };
    $('#rule-add').addEventListener('click', addRule);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') addRule(); });
    inp.focus();

    $('#rules-save').addEventListener('click', async () => {
      await api('/api/rules', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ patterns: rules }),
      });
      closeModal();
      toast(`${rules.length} auto-enable rules saved`);
    });

    $('#rules-apply').addEventListener('click', async () => {
      await api('/api/rules', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ patterns: rules }),
      });
      const result = await api('/api/rules/apply', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ patterns: rules }),
      });
      closeModal();
      toast(`Rules saved. ${result.count} existing points enabled.`);
      loadStats();
      loadPoints();
    });
  }
  render();
}

let valueRefreshTimer;
async function loadValues(paths) {
  try {
    const params = new URLSearchParams();
    paths.forEach(p => params.append('paths[]', p));
    const vals = await api('/api/values?' + params);
    document.querySelectorAll('[data-value-path]').forEach(el => {
      const v = vals[el.dataset.valuePath];
      if (v !== undefined) {
        el.textContent = v;
        el.classList.remove('point-value-na');
      }
    });
  } catch (e) {}
  clearTimeout(valueRefreshTimer);
  valueRefreshTimer = setTimeout(() => {
    const visible = document.querySelectorAll('[data-value-path]');
    if (visible.length > 0) {
      loadValues(Array.from(visible).map(el => el.dataset.valuePath));
    }
  }, 10000);
}

async function loadTemplates() {

  const filter = $('#device-type-filter');

  try {
    templates = (await api('/api/templates')).templates || [];

// -- Diagnostics ---------------------------------------------------------
//
// These checks were previously things somebody had to go looking for: a
// meter missing from the energy picker, a total bound to a register that
// resets nightly. Nothing has stopped working, which is exactly why it
// needs putting in front of someone.

let diagnostics = null;

function diagItemLine(finding, item) {
  const bits = [];
  if (item.name) bits.push(`<span class="grow">${esc(item.name)}</span>`);
  else if (item.group) bits.push(`<span class="grow">${esc(item.group)}</span>`);
  else if (item.path) bits.push(`<span class="grow">${esc(item.path)}</span>`);

  if (item.slot) bits.push(`<span>slot: ${esc(item.slot)}</span>`);
  if (item.unit) bits.push(`<span>${esc(item.unit)}</span>`);
  if (item.expected) bits.push(`<span>expected ${esc(item.expected.join(', '))}</span>`);
  if (item.status) bits.push(`<span>${esc(item.status)}</span>`);
  if (item.decreases) bits.push(`<span>${item.decreases}&times;</span>`);
  if (item.age != null) bits.push(`<span>${Math.round(item.age / 60)}m ago</span>`);
  else if ('age' in item) bits.push('<span>no value</span>');
  if (item.published) bits.push('<span>published</span>');
  return `<div class="diag-item">${bits.join('')}</div>`;
}

function renderDiagnostics() {
  const list = $('#diag-list');
  if (!diagnostics) { list.innerHTML = '<div class="loading">Checking...</div>'; return; }

  const findings = diagnostics.findings || [];
  const badge = $('#diag-badge');
  if (diagnostics.errors) {
    badge.textContent = ` ${diagnostics.errors}`;
    badge.style.color = 'var(--danger)';
  } else if (diagnostics.warnings) {
    badge.textContent = ` ${diagnostics.warnings}`;
    badge.style.color = '#d97706';
  } else {
    badge.textContent = '';
  }

  $('#diag-summary').textContent = findings.length
    ? `${diagnostics.errors} error${diagnostics.errors === 1 ? '' : 's'}, `
      + `${diagnostics.warnings} warning${diagnostics.warnings === 1 ? '' : 's'} `
      + `across ${diagnostics.checked} checks`
    : `All ${diagnostics.checked} checks passed`;

  if (!findings.length) {
    list.innerHTML = '<div class="diag-ok"><strong>Nothing to report</strong>'
      + 'No stale points, no suspicious bindings, no meters locked out of the '
      + 'energy dashboard.</div>';
    return;
  }

  list.innerHTML = findings.map((f, i) => `
    <div class="diag-card ${esc(f.severity)}">
      <div class="diag-head">
        <span class="diag-sev ${esc(f.severity)}">${esc(f.severity)}</span>
        <span class="diag-title">${esc(f.title)}</span>
      </div>
      <p class="diag-detail">${esc(f.detail)}</p>
      ${f.action ? `<p class="diag-action"><b>What to do:</b> ${esc(f.action)}</p>` : ''}
      ${f.count ? `<button class="diag-toggle" data-diag="${i}">Show ${f.count} affected &rsaquo;</button>
      <button class="diag-toggle" data-ack="${esc(f.id)}" data-count="${f.count}"
              style="margin-left:14px" title="Accept this as intended. It comes back if it grows.">Accept</button>
      <div class="diag-items" id="diag-items-${i}" style="display:none">
        ${f.items.map(item => diagItemLine(f, item)).join('')}
        ${f.truncated ? `<div class="diag-more">and ${f.truncated} more</div>` : ''}
      </div>` : ''}
    </div>`).join('');

  const accepted = diagnostics.acknowledged || [];
  if (accepted.length) {
    list.insertAdjacentHTML('beforeend', `
      <div class="diag-card" style="opacity:.75">
        <div class="diag-head"><span class="diag-title">Accepted as intended</span></div>
        <p class="diag-detail">These were reviewed and accepted. Each comes back
        on its own if it grows beyond what was accepted.</p>
        ${accepted.map(f => `<div class="diag-item">
          <span class="grow">${esc(f.title)}</span>
          ${f.note ? `<span>${esc(f.note)}</span>` : ''}
          <button class="diag-toggle" data-unack="${esc(f.id)}">Restore</button>
        </div>`).join('')}
      </div>`);
  }

  list.querySelectorAll('[data-ack]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const note = prompt('Why is this expected? (optional)') ?? '';
      await acknowledge(btn.dataset.ack, true, Number(btn.dataset.count), note);
    });
  });
  list.querySelectorAll('[data-unack]').forEach(btn => {
    btn.addEventListener('click', () => acknowledge(btn.dataset.unack, false));
  });

  list.querySelectorAll('.diag-toggle[data-diag]').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = $('#diag-items-' + btn.dataset.diag);
      const open = box.style.display !== 'none';
      box.style.display = open ? 'none' : '';
      btn.innerHTML = btn.innerHTML.replace(open ? '\u2039' : '\u203a',
                                            open ? '\u203a' : '\u2039');
    });
  });
}

async function acknowledge(id, accept, count, note) {
  try {
    await api('/api/diagnostics/ack', {

  } catch (e) {
    toast('Could not save that');
  }
}

function templateOptions(selected) {
  const none = `<option value=""${selected ? '' : ' selected'}>— none —</option>`;
  return none + templates.map(t =>
    `<option value="${t.id}"${t.id === selected ? ' selected' : ''}>${esc(t.name)}</option>`
  ).join('');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderDevices() {
  const term = deviceFilter.search.toLowerCase();
  const rows = devices.filter(d => {
    if (term && !d.name.toLowerCase().includes(term) && !d.group.toLowerCase().includes(term)) return false;
    if (deviceFilter.type === '__none__') return !d.template;
    if (deviceFilter.type === '__blocked__') return d.severity === 'blocked';
    if (deviceFilter.type === '__warning__') return d.severity === 'warning';
    if (deviceFilter.type === '__draft__') return d.template && d.state !== 'published';
    if (deviceFilter.type === '__published__') return d.state === 'published';
    if (deviceFilter.type && d.template !== deviceFilter.type) return false;
    return true;
  });

  if (!rows.length) {
    $('#device-table').innerHTML = '<tr><td colspan="7" class="empty">No devices match</td></tr>';
    return;
  }

  $('#device-table').innerHTML = rows.map(d => {
    let slots = '<span class="pill pill-none">—</span>';
    if (d.template) {
      const complete = d.required_bound >= d.required_total;
      slots = `<span class="pill ${complete ? 'pill-ok' : 'pill-warn'}">`
            + `${d.required_bound}/${d.required_total} required</span>`;
      if (d.bound_disabled) {
        slots += `<div class="slot-meta">${d.bound_disabled} bound point(s) disabled</div>`;
      }
    }
    let state = '<span class="pill pill-none">untyped</span>';
    if (d.state) {
      const cls = d.state === 'published' ? 'pill-published' : 'pill-draft';
      state = `<span class="pill ${cls}">${esc(d.state)}</span>`;
    }

    let health = '<span class="pill pill-none">—</span>';
    if (d.severity) {
      const cls = { ok: 'pill-ok', warning: 'pill-warn', blocked: 'pill-blocked' }[d.severity];
      const label = d.severity === 'ok' ? 'ready'
        : d.severity === 'warning' ? `${d.warnings} warning${d.warnings === 1 ? '' : 's'}`
        : `${d.blocked} blocked`;
      health = `<span class="pill ${cls}">${esc(label)}</span>`;
    }

    const suggestion = (!d.template && d.suggested_name)
      ? `<div class="slot-meta">suggested: ${esc(d.suggested_name)}</div>` : '';

    return `<tr data-group="${esc(d.group)}">
      <td>
        <div class="device-name">${esc(d.name)}</div>
        <div class="device-path">${esc(d.group)}</div>
      </td>
      <td>
        <span class="${d.enabled_count ? '' : 'slot-meta'}">${d.enabled_count}/${d.point_count}</span>
      </td>
      <td>
        <select class="type-select" data-group="${esc(d.group)}">${templateOptions(d.template)}</select>
        ${suggestion}
      </td>
      <td>${slots}</td>
      <td>${health}</td>
      <td>${state}</td>
      <td style="white-space:nowrap">${d.template ? `
        <button class="btn btn-sm" data-config="${esc(d.group)}">Configure</button>
        ${d.bound_disabled ? `<button class="btn btn-sm btn-primary" data-enable="${esc(d.group)}"
           title="Enable the ${d.bound_disabled} bound point(s) not yet enabled">Enable ${d.bound_disabled}</button>` : ''}
      ` : ''}
      ${d.template ? `<button class="btn btn-sm ${d.state === 'published' ? '' : 'btn-primary'}"
        data-publish="${esc(d.group)}" data-pub="${d.state === 'published' ? '0' : '1'}"
        ${d.state !== 'published' && d.severity === 'blocked' ? 'disabled title="Blocked — fix the issues first"' : ''}
        >${d.state === 'published' ? 'Unpublish' : 'Publish'}</button>` : ''}
      ${d.template ? `<button class="btn btn-sm" data-card="${esc(d.group)}"
        title="Show the Lovelace card for this device">Card</button>` : ''}
      <button class="btn btn-sm" data-points="${esc(d.group)}"
        data-on="${d.enabled_count < d.point_count ? '1' : '0'}"
        title="${d.enabled_count < d.point_count
          ? 'Enable every point in this device' : 'Disable every point in this device'}"
        >${d.enabled_count < d.point_count ? 'Enable all' : 'Disable all'}</button></td>
    </tr>`;
  }).join('');

  document.querySelectorAll('.type-select').forEach(sel => {
    sel.addEventListener('change', () => assignType(sel.dataset.group, sel.value));
  });
  document.querySelectorAll('[data-config]').forEach(btn => {
    btn.addEventListener('click', () => openDeviceConfig(btn.dataset.config));
  });
  document.querySelectorAll('[data-enable]').forEach(btn => {
    btn.addEventListener('click', () => enableSlotPoints(btn.dataset.enable));
  });
  document.querySelectorAll('[data-publish]').forEach(btn => {
    btn.addEventListener('click', () =>
      publishDevice(btn.dataset.publish, btn.dataset.pub === '1'));
  });
  document.querySelectorAll('[data-card]').forEach(btn => {
    btn.addEventListener('click', () => showDeviceCard(btn.dataset.card));
  });
  document.querySelectorAll('[data-points]').forEach(btn => {
    btn.addEventListener('click', () =>
      setDevicePoints(btn.dataset.points, btn.dataset.on === '1'));
  });
}

async function assignType(group, templateId) {
  try {
    if (!templateId) {
      await api('/api/devices/unassign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group }),
      });
      toast('Device type cleared');
    } else {
      const res = await api('/api/devices/assign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group, template: templateId }),
      });
      toast(res.missing_required && res.missing_required.length
        ? `Assigned — ${res.missing_required.length} required slot(s) unbound`
        : 'Device type assigned');
    }
    await loadDevices();
  } catch (e) {
    toast('Could not change device type');
  }
}

async function publishDevice(group, publish) {
  try {
    const res = await fetch(BASE + '/api/devices/publish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group, publish }),
    });
    const body = await res.json();
    if (!res.ok) {
      toast(body.error || 'Could not change publish state');
      if (body.issues && body.issues.length) alert('Blocked by:\n• ' + body.issues.join('\n• '));
      return;
    }
    toast(publish ? 'Device published' : 'Device unpublished');
    await loadDevices();
  } catch (e) {
    toast('Could not change publish state');
  }
}

$('#btn-publish-all').addEventListener('click', async e => {
  const btn = e.currentTarget;
  btn.disabled = true; btn.textContent = 'Working...';
  try {
    const res = await api('/api/devices/publish-all', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    toast(`Published ${res.published} device(s)`
      + (res.blocked ? `; ${res.blocked} blocked` : ''));
    await loadDevices();
  } catch (err) {
    toast('Could not publish');
  } finally {
    btn.disabled = false; btn.textContent = 'Publish All';
  }
});

async function setDevicePoints(group, enabled) {
  try {
    const res = await api('/api/devices/set-points', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group, enabled }),
    });
    toast(`${enabled ? 'Enabled' : 'Disabled'} ${res.changed} point(s)`);
    await loadDevices();
    loadStats();
  } catch (e) {
    toast('Could not change points');
  }
}

/* -- Template editor -------------------------------------------------- */

function blankSlot() {
  return { key: '', name: '', required: false, device_class: '', units: [],
           point_types: [], match: [], validation: {} };
}

async function openTemplateList() {
  templates = [];
  await loadTemplates();
  const rows = templates.map(t => `
    <tr>
      <td>
        <div class="slot-key">${esc(t.name)}</div>
        <div class="slot-meta">${esc(t.id)} · ${t.slots.length} slots${t.builtin ? ' · built-in' : ''}</div>
      </td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-sm" data-rebind-tpl="${esc(t.id)}"
          title="Re-apply this template to every device using it">Re-apply</button>
        <button class="btn btn-sm" data-exp-tpl="${esc(t.id)}">Export</button>
        <button class="btn btn-sm" data-edit-tpl="${esc(t.id)}">${t.builtin ? 'Customize' : 'Edit'}</button>
        ${t.builtin ? '' : `<button class="btn btn-sm" data-del-tpl="${esc(t.id)}">Delete</button>`}
      </td>
    </tr>`).join('');

  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal modal-wide">
        <h2>Device Templates</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">
          Customizing a built-in saves your own copy that shadows it — delete
          yours to go back to the shipped one. Templates live in
          <code>/config/niagara-ha/templates/</code>.
        </p>
        <div style="max-height:46vh;overflow:auto">
          <table class="slot-table">${rows}</table>
        </div>
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px">
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" id="tpl-new">New Template</button>
            <button class="btn" id="tpl-import">Import</button>
            <button class="btn" id="tpl-export-all">Export All</button>
          </div>
          <button class="btn" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>`;

  $('#tpl-new').addEventListener('click', () => openTemplateEditor(null));
  $('#tpl-import').addEventListener('click', openTemplateImport);
  $('#tpl-export-all').addEventListener('click', () => exportTemplates(''));
  document.querySelectorAll('[data-exp-tpl]').forEach(b =>
    b.addEventListener('click', () => exportTemplates(b.dataset.expTpl)));
  document.querySelectorAll('[data-rebind-tpl]').forEach(b =>
    b.addEventListener('click', async () => {
      const id = b.dataset.rebindTpl;
      if (!confirm(`Re-apply "${id}" to every device using it?\n\n`
        + 'Slot bindings are recalculated from the template, so any manual '
        + 'binding on those devices is replaced.')) return;
      try {
        const res = await api('/api/devices/rebind', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ template: id }),
        });
        toast(`Re-applied to ${res.rebound} device(s); ${res.changed} changed`);
        closeModal();
        await loadDevices();
      } catch (e) { toast('Could not re-apply'); }
    }));
  document.querySelectorAll('[data-edit-tpl]').forEach(b =>
    b.addEventListener('click', () => openTemplateEditor(b.dataset.editTpl)));
  document.querySelectorAll('[data-del-tpl]').forEach(b =>
    b.addEventListener('click', async () => {
      if (!confirm(`Delete template "${b.dataset.delTpl}"?`)) return;
      try {
        await api('/api/templates/' + encodeURIComponent(b.dataset.delTpl), { method: 'DELETE' });
        toast('Template deleted');
        templates = [];
        await loadTemplates();
        openTemplateList();
      } catch (e) { toast('Could not delete template'); }
    }));
}

let editorSlots = [];

function renderEditorSlots() {
  $('#tpl-slots').innerHTML = editorSlots.map((sl, i) => `
    <tr>
      <td>
        <input class="slot-select" data-f="name" data-i="${i}" value="${esc(sl.name)}" placeholder="Slot name">
        <input class="slot-select" data-f="key" data-i="${i}" value="${esc(sl.key)}"
               placeholder="key" style="margin-top:4px">
      </td>
      <td>
        <input class="slot-select" data-f="match" data-i="${i}"
               value="${esc((sl.match || []).join(', '))}" placeholder="*temp*, *-temp">
        <div style="display:flex;gap:4px;margin-top:4px">
          <input class="slot-select" data-f="units" data-i="${i}"
                 value="${esc((sl.units || []).join(', '))}" placeholder="°C, °F">
          <input class="slot-select" data-f="device_class" data-i="${i}"
                 value="${esc(sl.device_class || '')}" placeholder="temperature">
        </div>
        <div style="display:flex;gap:4px;margin-top:4px;align-items:center">
          <input class="slot-select" data-f="point_types" data-i="${i}"
                 value="${esc((sl.point_types || []).join(', '))}" placeholder="numeric, boolean">
          <input class="slot-select" data-f="min" data-i="${i}"
                 value="${sl.validation && sl.validation.min != null ? sl.validation.min : ''}" placeholder="min">
          <input class="slot-select" data-f="max" data-i="${i}"
                 value="${sl.validation && sl.validation.max != null ? sl.validation.max : ''}" placeholder="max">
        </div>
      </td>
      <td style="white-space:nowrap;text-align:right">
        <label class="slot-meta"><input type="checkbox" data-f="required" data-i="${i}"
          ${sl.required ? 'checked' : ''}> req</label>
        <button class="btn btn-sm" data-rm="${i}">×</button>
      </td>
    </tr>`).join('');

  $('#tpl-slots').querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener('change', () => {
      const sl = editorSlots[+el.dataset.i], f = el.dataset.f;
      if (f === 'required') sl.required = el.checked;
      else if (f === 'min' || f === 'max') {
        sl.validation = sl.validation || {};
        if (el.value.trim() === '') delete sl.validation[f];
        else sl.validation[f] = parseFloat(el.value);
      } else if (['match', 'units', 'point_types'].includes(f)) {
        sl[f] = el.value.split(',').map(v => v.trim()).filter(Boolean);
      } else sl[f] = el.value;
    });
  });
  $('#tpl-slots').querySelectorAll('[data-rm]').forEach(b =>
    b.addEventListener('click', () => {
      editorSlots.splice(+b.dataset.rm, 1);
      renderEditorSlots();
    }));
}

function openTemplateEditor(id) {
  const base = id ? templates.find(t => t.id === id) : null;
  editorSlots = base ? JSON.parse(JSON.stringify(base.slots)) : [blankSlot()];

  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal modal-wide">
        <h2>${base ? (base.builtin ? 'Customize' : 'Edit') + ' ' + esc(base.name) : 'New Template'}</h2>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input class="slot-select" id="tpl-id" placeholder="id (lowercase)"
                 value="${base ? esc(base.id) : ''}">
          <input class="slot-select" id="tpl-name" placeholder="Display name"
                 value="${base ? esc(base.name) : ''}">
        </div>
        <input class="slot-select" id="tpl-desc" placeholder="Description"
               value="${base ? esc(base.description || '') : ''}">
        <textarea class="slot-select" id="tpl-card" rows="4" style="margin-top:8px;font-family:monospace"
          placeholder="Optional Lovelace card YAML, using {{slot.key}} placeholders">${base && base.card && Object.keys(base.card).length ? esc(toYaml(base.card)) : ''}</textarea>
        <input class="slot-select" id="tpl-devmatch" style="margin-top:8px"
               placeholder="Folder name hints, e.g. *fridge*, *freezer*"
               value="${base ? esc((base.device_match || []).join(', ')) : ''}">
        <h3 style="margin-top:14px">Slots</h3>
        <p class="slot-meta" style="margin-bottom:6px">
          Name and key, then the name patterns that match a point, its accepted
          units, device class, point types and plausible range.
        </p>
        <div style="max-height:40vh;overflow:auto">
          <table class="slot-table"><tbody id="tpl-slots"></tbody></table>
        </div>
        <button class="btn btn-sm" id="tpl-add-slot" style="margin-top:8px">Add slot</button>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="tpl-save">Save Template</button>
        </div>
      </div>
    </div>`;

  renderEditorSlots();
  $('#tpl-add-slot').addEventListener('click', () => {
    editorSlots.push(blankSlot());
    renderEditorSlots();
  });

  $('#tpl-save').addEventListener('click', async () => {
    const payload = {
      id: $('#tpl-id').value.trim().toLowerCase(),
      name: $('#tpl-name').value.trim(),
      description: $('#tpl-desc').value.trim(),
      device_match: $('#tpl-devmatch').value.split(',').map(v => v.trim()).filter(Boolean),
      slots: editorSlots,
    };
    const cardText = $('#tpl-card').value.trim();
    if (cardText) {
      try {
        payload.card = parseSimpleYaml(cardText);
      } catch (err) {
        toast('Card YAML could not be parsed: ' + err.message);
        return;
      }
    }
    try {
      const res = await fetch(BASE + '/api/templates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const body = await res.json();
      if (!res.ok) { toast(body.error || 'Template rejected'); return; }
      closeModal();
      toast('Template saved');
      templates = [];
      await loadDevices();
    } catch (e) {
      toast('Could not save template');
    }
  });
}


/* -- YAML helpers (small subset: the card shapes we emit) ------------- */

function toYaml(value, indent) {
  indent = indent || 0;
  const pad = '  '.repeat(indent);
  if (Array.isArray(value)) {
    if (!value.length) return '[]';
    return value.map(v => {
      const body = toYaml(v, indent + 1);
      return (v && typeof v === 'object')
        ? pad + '- ' + body.trimStart()
        : pad + '- ' + body;
    }).join('\n');
  }
  if (value && typeof value === 'object') {
    return Object.entries(value).map(([k, v], i) => {
      if (v && typeof v === 'object') {
        const nested = toYaml(v, indent + 1);
        return (i === 0 ? '' : pad) + k + ':\n' + nested;
      }
      return (i === 0 ? '' : pad) + k + ': ' + toYaml(v, indent);
    }).join('\n');
  }
  if (value == null) return '';
  if (typeof value === 'string' && /[:#{}\[\]]|^\s|\s$/.test(value)) {
    return '"' + value.replace(/"/g, '\\"') + '"';
  }
  return String(value);
}

function parseSimpleYaml(text) {
  const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
  const scalar = t => {
    t = t.trim();
    if ((t.startsWith('"') && t.endsWith('"')) || (t.startsWith("'") && t.endsWith("'")))
      return t.slice(1, -1);
    if (t === 'true') return true;
    if (t === 'false') return false;
    if (t !== '' && !isNaN(Number(t))) return Number(t);
    return t;
  };
  const indentOf = l => l.length - l.replace(/^\s*/, '').length;

  function blockIn(src, i, indent) {
    const obj = {};
    while (i < src.length) {
      const line = src[i];
      const ind = indentOf(line);
      if (ind < indent) break;
      if (ind > indent) { i += 1; continue; }
      const trimmed = line.trim();
      if (trimmed.startsWith('- ')) break;
      const idx = trimmed.indexOf(':');
      if (idx < 0) { i += 1; continue; }
      const key = trimmed.slice(0, idx).trim();
      const rest = trimmed.slice(idx + 1).trim();
      if (rest) { obj[key] = scalar(rest); i += 1; continue; }
      let j = i + 1;
      if (j < src.length && indentOf(src[j]) > indent) {
        const [val, used] = nested(src, j, indentOf(src[j]));
        obj[key] = val;
        i = used;
      } else if (j < src.length && src[j].trim().startsWith('- ') && indentOf(src[j]) === indent) {
        const [val, used] = nested(src, j, indent);
        obj[key] = val;
        i = used;
      } else { obj[key] = null; i = j; }
    }
    return [obj, i];
  }

  function nested(src, i, indent) {
    if (src[i].trim().startsWith('- ')) {
      const arr = [];
      while (i < src.length && indentOf(src[i]) >= indent && src[i].trim().startsWith('- ')) {
        const body = src[i].trim().slice(2);
        if (body.includes(':')) {
          const chunk = [' '.repeat(indent + 2) + body];
          let j = i + 1;
          while (j < src.length && indentOf(src[j]) > indent && !src[j].trim().startsWith('- ')) {
            chunk.push(src[j]); j += 1;
          }
          arr.push(blockIn(chunk, 0, indent + 2)[0]);
          i = j;
        } else { arr.push(scalar(body)); i += 1; }
      }
      return [arr, i];
    }
    return blockIn(src, i, indent);
  }

  const [result] = blockIn(lines, 0, indentOf(lines[0] || ''));
  if (!result || !Object.keys(result).length) throw new Error('nothing parsed');
  return result;
}

async function exportTemplates(id) {
  try {
    const q = id ? '?id=' + encodeURIComponent(id) : '';
    const res = await api('/api/templates/export' + q);
    showYamlModal(id ? `Export: ${id}` : `Export all (${res.count} templates)`, res.yaml);
  } catch (e) {
    toast('Could not export');
  }
}

function showYamlModal(title, text) {
  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal modal-wide">
        <h2>${esc(title)}</h2>
        <textarea id="yaml-out" class="slot-select" rows="18"
          style="font-family:monospace;white-space:pre">${esc(text)}</textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="btn" id="yaml-copy">Copy</button>
          <button class="btn" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>`;
  $('#yaml-copy').addEventListener('click', () => {
    const ta = $('#yaml-out');
    ta.select();
    try { document.execCommand('copy'); toast('Copied'); }
    catch (e) { toast('Select the text and copy manually'); }
  });
}

function openTemplateImport() {
  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal modal-wide">
        <h2>Import Templates</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:10px">
          Paste exported YAML. Several templates can be separated by
          <code>---</code>. Each is validated on its own, so one bad template
          will not discard the rest.
        </p>
        <textarea id="yaml-in" class="slot-select" rows="16"
          style="font-family:monospace" placeholder="id: my_template&#10;name: My Template&#10;slots:&#10;  - key: temperature"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="yaml-import">Import</button>
        </div>
      </div>
    </div>`;
  $('#yaml-import').addEventListener('click', async () => {
    const text = $('#yaml-in').value;
    if (!text.trim()) { toast('Nothing to import'); return; }
    try {
      const res = await fetch(BASE + '/api/templates/import', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ yaml: text }),
      });
      const body = await res.json();
      if (!res.ok) { toast(body.error || 'Import failed'); return; }
      closeModal();
      const errs = (body.errors || []).length;
      toast(`Imported ${body.saved.length} template(s)` + (errs ? `, ${errs} rejected` : ''));
      if (errs) alert('Rejected:\n' + body.errors.join('\n'));
      templates = [];
      await loadDevices();
    } catch (e) {
      toast('Import failed');
    }
  });
}

async function showDeviceCard(group) {
  try {
    const res = await api('/api/devices/card?group=' + encodeURIComponent(group));
    const yamlText = toYaml(res.card);
    showYamlModal(`Card: ${res.device_name}`,
      yamlText + '\n\n# Slots above are point paths. Run the\n'
      + '# niagara.generate_card action in Home Assistant to get\n'
      + '# this card with real entity ids:\n'
      + '#   action: niagara.generate_card\n'
      + '#   data:\n'
      + '#     device: ' + group);
  } catch (e) {
    toast('No card for this device type');
  }
}

async function openDeviceConfig(group) {
  let detail;
  try {
    detail = await api('/api/devices/detail?group=' + encodeURIComponent(group));
  } catch (e) {
    toast('Could not load device');
    return;
  }

  const allPoints = detail.points || [];
  const optionFor = (p, selected) =>
    `<option value="${esc(p.path)}"${p.path === selected ? ' selected' : ''}>`
    + `${esc(p.name)}${p.unit ? ' [' + esc(p.unit) + ']' : ''}`
    + `${p.enabled ? '' : ' (disabled)'}</option>`;

  const slotRows = detail.slots.map(s => {
    const suggested = s.suggested || [];
    const suggestedPaths = new Set(suggested.map(c => c.path));
    const rest = allPoints.filter(p => !suggestedPaths.has(p.path));

    let opts = '<option value="">— unbound —</option>';
    if (suggested.length) {
      opts += `<optgroup label="Suggested">`
            + suggested.map(p => optionFor(p, s.bound_path)).join('') + '</optgroup>';
    }
    if (rest.length) {
      opts += `<optgroup label="All other points in this device">`
            + rest.map(p => optionFor(p, s.bound_path)).join('') + '</optgroup>';
    }

    const meta = [s.device_class, (s.units || []).join(' / ')].filter(Boolean).join(' · ');
    const toggle = s.bound_path
      ? `<label class="slot-meta" style="display:flex;align-items:center;gap:5px;margin-top:4px">
           <input type="checkbox" data-enable-point="${esc(s.bound_path)}"
                  ${s.bound_enabled ? 'checked' : ''}> enabled
         </label>`
      : '';

    const issues = (s.issues || []).map(i =>
      `<div class="issue issue-${esc(i.severity)}">${esc(i.message)}</div>`).join('');

    return `<tr>
      <td style="width:38%">
        <div class="slot-key">${esc(s.name)}${s.required ? '<span class="slot-req">*</span>' : ''}</div>
        <div class="slot-meta">${esc(meta)}</div>
      </td>
      <td>
        <select class="slot-select" data-slot="${esc(s.key)}">${opts}</select>
        ${toggle}
        ${issues}
      </td>
    </tr>`;
  }).join('');

  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal modal-wide">
        <h2>${esc(detail.group.split('/').pop())}</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">
          ${esc(detail.template_name)} — choose which point fills each slot.
          Slots marked <span class="slot-req">*</span> are required.
          ${detail.severity && detail.severity !== 'ok'
            ? ` This device is <strong>${esc(detail.severity)}</strong>: values below
                contradict what the template expects.` : ''}
        </p>
        <table class="slot-table">${slotRows}</table>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="slots-save">Save Bindings</button>
        </div>
      </div>
    </div>`;

  $('#slots-save').addEventListener('click', async () => {
    const bindings = {};
    document.querySelectorAll('.slot-select').forEach(sel => {
      bindings[sel.dataset.slot] = sel.value || null;
    });
    const enablePaths = [], disablePaths = [];
    document.querySelectorAll('[data-enable-point]').forEach(cb => {
      (cb.checked ? enablePaths : disablePaths).push(cb.dataset.enablePoint);
    });
    try {
      const res = await api('/api/devices/assign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group, template: detail.template, bindings }),
      });
      for (const [paths, enabled] of [[enablePaths, true], [disablePaths, false]]) {
        if (!paths.length) continue;
        await api('/api/devices/set-points', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ group, paths, enabled }),
        });
      }
      closeModal();
      toast(res.missing_required && res.missing_required.length
        ? `Saved — ${res.missing_required.length} required slot(s) still unbound`
        : 'Bindings saved');
      await loadDevices();
    } catch (e) {
      toast('Could not save bindings');
    }
  });
}

$('#btn-templates').addEventListener('click', openTemplateList);

$('#device-search').addEventListener('input', e => {
  deviceFilter.search = e.target.value;
  renderDevices();
});
$('#device-type-filter').addEventListener('change', e => {
  deviceFilter.type = e.target.value;
  renderDevices();
});

loadDeviceFolders().then(() => {
  loadStats();
  loadTree();
  loadPoints();
});
