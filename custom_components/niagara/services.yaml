generate_card:
  name: Generate device card
  description: >-
    Build a Lovelace card for a typed Niagara device. The device's template
    declares which slot goes where; this resolves those slots to the entity
    ids they became and returns ready-to-paste YAML.
  fields:
    device:
      name: Device
      description: >-
        The device folder path, exactly as shown in the add-on's Devices view
        (for example Jace1/BMS/HVAC/AC/Rooms/$3331).
      required: true
      example: Jace1/BMS/HVAC/AC/Rooms/$3331
      selector:
        text:

fix_statistics_units:
  name: Fix statistics units
  description: >-
    Rewrite long-term statistics metadata to match the unit each entity now
    reports. When a point's unit changes, Home Assistant stops recording for
    it and logs a conflict — the meter simply goes flat on the energy
    dashboard with nothing said about why.
  fields:
    dry_run:
      name: Dry run
      description: Report what would change without changing anything.
      required: false
      default: false
      selector:
        boolean:

run_diagnostics:
  name: Run diagnostics
  description: >-
    Return the add-on's full diagnostics report — stale points, suspicious
    bindings, meters that cannot reach the energy dashboard. The same checks
    the add-on's Diagnostics view shows, in a form an automation can act on.

rescan:
  name: Re-scan points
  description: >-
    Rediscover points from the Niagara station. Points added in Niagara do
    not appear here until something goes looking; this asks the add-on to
    look now rather than waiting for a reconnect. Rediscovery starts within
    one poll interval.

generate_cards:
  name: Generate all device cards
  description: >-
    Every published device's card in one call, each with the area it sits
    in. Intended for the dashboard strategy, which lays cards out by area.
  fields:
    area:
      name: Area
      description: Limit to one area id. Omit for every area.
      required: false
      selector:
        text:

sync_history:
  name: Sync trend logs
  description: >-
    Import the station's trend logs into Home Assistant's long-term
    statistics, for the trends switched on in the add-on's History screen.
    Each run is bounded, so a station holding years of trend catches up over
    several runs; call this to move it along rather than waiting for the
    timer. Only measurement sensors are imported — a cumulative total needs
    a sum that cannot be derived from a window of samples.
  fields:
    history:
      name: Trend log
      description: >-
        Sync only this one trend log, named as the History screen shows it.
        Leave empty to sync all of them.
      required: false
      example: Jace1/AHU1_SupplyTemp
      selector:
        text:
