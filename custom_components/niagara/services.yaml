generate_card:
  name: Generate device card
  description: >-
    Build a Lovelace card for a typed Niagara device. The device's template
    declares which slot goes where; this resolves those slots to the entity
    ids they became and returns ready-to-paste YAML.
  fields:
    device:
      name: Device
      description: >-
        The device folder path, exactly as shown in the add-on's Devices view
        (for example Jace1/BMS/HVAC/AC/Rooms/$3331).
      required: true
      example: Jace1/BMS/HVAC/AC/Rooms/$3331
      selector:
        text:

fix_statistics_units:
  name: Fix statistics units
  description: >-
    Rewrite long-term statistics metadata to match the unit each entity now
    reports. When a point's unit changes, Home Assistant stops recording for
    it and logs a conflict — the meter simply goes flat on the energy
    dashboard with nothing said about why.
  fields:
    dry_run:
      name: Dry run
      description: Report what would change without changing anything.
      required: false
      default: false
      selector:
        boolean:

run_diagnostics:
  name: Run diagnostics
  description: >-
    Return the add-on's full diagnostics report — stale points, suspicious
    bindings, meters that cannot reach the energy dashboard. The same checks
    the add-on's Diagnostics view shows, in a form an automation can act on.
