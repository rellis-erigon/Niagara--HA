name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon:
    name: Add-on tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest requests PyYAML
      - name: Run add-on tests
        run: pytest niagara-ha/tests -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install pytest homeassistant
      - name: Run integration tests
        run: pytest tests -q
